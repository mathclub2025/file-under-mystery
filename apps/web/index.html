<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FILE UNDER MYSTERY — Department of Mathematics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // Immediate Root-Level Anti-Inspect & DevTools Shield
      (function() {
        var block = function(e) {
          var k = e.key ? e.key.toUpperCase() : '';
          var c = e.ctrlKey || e.metaKey;
          var s = e.shiftKey;
          var a = e.altKey;
          if (e.keyCode === 123 || k === 'F12') { e.preventDefault(); e.stopPropagation(); return false; }
          if (c && s && (k === 'I' || k === 'J' || k === 'C' || k === 'K' || k === 'E' || k === 'S')) { e.preventDefault(); e.stopPropagation(); return false; }
          if (e.metaKey && a && (k === 'I' || k === 'J' || k === 'C' || k === 'U' || k === 'K')) { e.preventDefault(); e.stopPropagation(); return false; }
          if (c && (k === 'U' || e.keyCode === 85 || k === 'S' || e.keyCode === 83)) { e.preventDefault(); e.stopPropagation(); return false; }
        };
        window.addEventListener('keydown', block, true);
        window.addEventListener('keyup', block, true);
        document.addEventListener('keydown', block, true);
        document.addEventListener('keyup', block, true);
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); e.stopPropagation(); return false; }, true);
      })();
    </script>
  </head>
  <body class="bg-mystery-bg text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
